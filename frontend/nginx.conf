# The only public entry point: serves the React app and proxies the API, so the browser
# sees one origin (like the Vite proxy in development). Certificates come from ./certs
# (scripts/make-certs.sh) mounted at /etc/nginx/certs.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 3m;  # backend limits are stricter (2 MB images)

    # Security headers for the app (API responses also carry the backend's own headers).
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # nginx's mime.types has no entry for .webmanifest (it would go out as octet-stream).
    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        types { }
        try_files $uri =404;
    }

    # Client-side routes (/admin/logs, /gate…) all load index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location ~ ^/(api|media|webhooks)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;  # stream uploads; the backend enforces its size caps
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;  # the admin feed stays open (pings every 25 s)
    }
}
